[project]
name = "pypi-pigeon"
version = "0.2.0"
description = "TUI toolkit for maintaining a PyPI mirror on an airgapped network"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
classifiers = [
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: System :: Systems Administration",
    "Topic :: Utilities",
]
dependencies = [
    "bandersnatch>=7.1.0",
    "textual>=0.80.0",
]

[project.urls]
Homepage = "https://github.com/samikool/pypi-pigeon"
"Bug Tracker" = "https://github.com/samikool/pypi-pigeon/issues"

[project.scripts]
pigeon = "pypi_pigeon.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pypi_pigeon"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
