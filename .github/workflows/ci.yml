name: CI

on:
  push:
    branches: [master, dev]
    tags-ignore: ["v*"]
  pull_request:
    branches: [master, dev]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --dev

      - name: Lint
        run: uv run ruff check src/

      - name: Test
        run: uv run pytest tests/

      - name: Build (verify package builds cleanly)
        run: uv build
